name: 籌碼監控推播引擎

on:
  schedule:
    # 週一至週五 UTC 11:30 = 台灣時間 19:30
    # 刻意避開整點觸發：GitHub Actions 排程在整點（如 UTC 12:00）
    # 屬於高負載時段，容易塞隊delay，錯開幾分鐘可降低延遲機率
    - cron: "30 11 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "補跑指定日期（YYYY-MM-DD），留空則使用今日"
        required: false
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run chip monitor
        id: run
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
        run: |
          # 一律先把「這次實際要跑哪一天」算成一個明確的變數，而不是分別在跑
          # main.py 跟寫 commit message 時各自重算一次——不然手動補跑指定日期時，
          # commit message 會照樣寫成 workflow 執行當下的日期，跟資料實際代表的
          # 日期對不上。
          if [ -n "${{ github.event.inputs.date }}" ]; then
            TARGET_DATE="${{ github.event.inputs.date }}"
          else
            TARGET_DATE="$(date +'%Y-%m-%d')"
          fi
          echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
          python main.py --date "$TARGET_DATE"

          # 跟上面的分析流程完全無關，單純清掉超過保留天數的舊快照/報告目錄；
          # 這行失敗會讓這個 step 中止（沒接著跑 commit），失敗時 GitHub Actions
          # 預設就會寄失敗通知信，不需要另外處理。
          python main.py --purge

      - name: Commit snapshot data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: 更新籌碼快照資料 ${{ steps.run.outputs.target_date }}"
          git push
