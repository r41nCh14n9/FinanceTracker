股價波動相對較低的50檔股票組合所編製而成的指數。\u003C\u002Fspan\u003E\u003C\u002Fspan\u003E\u003C\u002Fp\u003E\n\n\u003Cp style=\"text-align:justify\"\u003E&nbsp;\u003C\u002Fp\u003E\n\n\u003Cp style=\"text-align:justify\"\u003E\u003Cspan style=\"font-size:12pt\"\u003E\u003Cspan style=\"color:black\"\u003E傳統市值型指數選股邏輯依照投資母體中所有股票依照市值排序，由市值大到小選取指定之成分股檔數，權重則依照各檔股票的市值大小進行權重配置。本指數指數選股邏輯則先以財報數據(股東權益報酬率、每股盈餘、營運現金流量)、財務指標(本益比、股息率、股息配發率、股價動能)進行成分股篩選，權重則依照整體指數波動度最小化為目標進行股票權重配置，單一成分股權重配置上限為10%。本指數在指數選股邏輯與成分股權重配置方式皆與傳統市值型指數不同，故指數績效走勢也會產生差異。本指數投資策略之風險特性相對傳統市值型指數具有波動度較低、現金股息率較高之投資標的特性。在產業風險配置上相對於傳統市值型指數最大差異的產業為半導體產業(減碼)、通訊網路(加碼)與電子零組件(加碼)、與電腦週邊設備(加碼)。\u003C\u002Fspan\u003E\u003C\u002Fspan\u003E\u003C\u002Fp\u003E\n\n\u003Cp style=\"text-align:justify\"\u003E\u003Cspan style=\"font-size:12pt\"\u003E\u003Cstrong\u003E\u003Cspan style=\"color:red\"\u003E客製化指數風險數據差異揭露\u003C\u002Fspan\u003E\u003C\u002Fstrong\u003E\u003C\u002Fspan\u003E\u003C\u002Fp\u003E\n\n\u003Ctable cellspacing=\"0\" class=\"Table\" style=\"border-collapse:collapse\"\u003E\n\t\u003Ctbody\u003E\n\t\t\u003Ctr\u003E\n\t\t\t\u003Ctd style=\"border-bottom:1px solid black; border-left:1px solid black; border-right:1px solid black; border-top:1px solid black; vertical-align:top; width:184px\"\u003E\n\t\t\t\u003Cp\u003E&nbsp;\u003C\u002Fp\u003E\n\t\t\t\u003C\u002Ftd\u003E\n\t\t\t\u003Ctd style=\"border-bottom:1px solid black; border-left:none; border-right:1px solid black; border-top:1px solid black; vertical-align:top; width:184px\"\u003E\n\t\t\t\u003Cp\u003E\u003Cspan style=\"font-size:12pt\"\u003E\u003Cstrong\u003E\u003Cspan style=\"color:black\"\u003E臺灣指數公司特選高股息低波動指數\u003C\u002Fspan\u003E\u003C\u002Fstrong\u003E\u003C\u002Fspan\u003E\u003C\u002Fp\u003E\n\t\t\t\u003C\u002Ftd\u003E\n\t\t\t\u003Ctd style=\"border-bottom:1px solid black; border-left:none; border-right:1px solid black; border-top:1px solid black; vertical-align:top; width:184px\"\u003E\n\t\t\t\u003Cp\u003E\u003Cspan style=\"font-size:12pt\"\u003E\u003Cstrong\u003E傳統市值型指數(以台灣加權總報酬指 E\u003C\u002Fspan\u003E\u003C\u002Fp\u003E\n\n\u003Cp style=\"text-align:justify\"\u003E&nbsp;\u003C\u002Fp\u003E\n\n\u003Cp style=\"text-align:justify\"\u003E\u003Cspan style=\"font-size:12pt\"\u003E\u003Cspan style=\"color:black\"\u003E傳統市值型債券指數之成分債選取邏輯是納入符合投資母體條件中所有債券，權重則依照各檔債券的市值大小進行權重配置。本指數選債邏輯則以長天期(債券距到期日須大於20年) 、A級以上信用評等(指數信用評等需至少為\u003C\u002Fspan\u003E\u003C\u002Fspan\u003E\u003C\u002Fp\u003E\n\n\u003Cp style=\"text-align:justify\"\u003E\u003Cspan style=\"font-size:12pt\"\u003E\u003Cspan style=\"color:black\"\u003EAAA\u003C\u002Fspan\u003E\u003Cspan style=\"color:black\"\u003E至A-)以及流動性(\u003C\u002Fspan\u003E\u003Cspan style=\"color:black\"\u003E債券最小流通在外面額須大於7.5億美元)\u003C\u002Fspan\u003E \u003Cspan style=\"color:black\"\u003E進行成分債篩選，單一產業權重上限為15%。因此與傳統市值型指數不同，故指數績效走勢也會產生差異。\u003C\u002Fspan\u003E\u003C\u002Fspan\u003E\u003C\u002Fp\u003E\n\n\u003Cp style=\"text-align:justify\"\u003E\u003Cspan style=\"font-size:12pt\"\u003E\u003Cstrong\u003E\u003Cspan style=\"color:red\"\u003E客製化指數風險數據差異揭露\u003C\u002Fspan\u003E\u003C\u002Fstrong\u003E\u003C\u002Fspan\u003E\u003C\u002Fp\u003E\n\n\u003Ctable cellspacing=\"0\" class=\"MsoTableGrid\" style=\"border-collapse:collapse; border:none\"\u003E\n\t\u003Ctbody\u003E\n\t\t\u003Ctr\u003E\n\t\t\t\u003Ctd style=\"border-bottom:1px solid black; border-left:1px solid black; border-right:1px solid black; border-top:1px solid black; vertical-align:top; width:141px\"\u003E\n\t\t\t\u003Cp\u003E&nbsp;\u003C\u002Fp\u003E\n\t\t\t\u003C\u002Ftd\u003E\n\t\t\t\u003Ctd style=\"border-bottom:1px solid black; border-left:none; border-right:1px solid black; border-top:1px solid black; vertical-align:top; width:198px\"\u003E\n\t\t\t\u003Cp\u003E\u003Cspan style=\"font-size:12pt\"\u003E\u003Cstrong\u003E\u003Cspan style=\"color:black\"\u003E彭博美國\u003C\u002Fspan\u003E\u003C\u002Fstrong\u003E\u003Cstrong\u003E\u003Cspan style=\"color:black\"\u003E 20+ \u003C\u002Fspan\u003E\u003C\u002Fstrong\u003E\u003Cstrong\u003E\u003Cspan style=\"color:black\"\u0 ify\"\u003E&nbsp;\u003C\u002Fp\u003E\n\n\u003Cp style=\"text-align:justify\"\u003E\u003Cspan style=\"font-size:12pt\"\u003E\u003Cspan style=\"color:black\"\u003E傳統市值型債券指數之成分債選取邏輯是納入符合投資母體條件中所有債券，權重則依照各檔債券的市值大小進行權重配置。本指數選債邏輯則以FTSE債券指數之產業分類定義中為公用事業中電能相關之行業所發行美元計價之公司債且長天期(債券距到期日須大於10年) 、信用評等需至少為BBB-以上以及流動性(\u003C\u002Fspan\u003E\u003Cspan style=\"color:black\"\u003E債券最小流通在外面額須大於5億美元)\u003C\u002Fspan\u003E \u003Cspan style=\"color:black\"\u003E進行成分債篩選。因此與傳統市值型指數不同，故指數績效走勢也會產生差異。\u003C\u002Fspan\u003E\u003C\u002Fspan\u003E\u003C\u002Fp\u003E\n\n\u003Cp style=\"text-align:justify\"\u003E\u003Cspan style=\"font-size:12pt\"\u003E\u003Cstrong\u003E\u003Cspan style=\"color:red\"\u003E客製化指數風險數據差異揭露\u003C\u002Fspan\u003E\u003C\u002Fstrong\u003E\u003C\u002Fspan\u003E\u003C\u002Fp\u003E\n\n\u003Ctable cellspacing=\"0\" class=\"MsoTableGrid\" style=\"border-collapse:collapse; border:none\"\u003E\n\t\u003Ctbody\u003E\n\t\t\u003Ctr\u003E\n\t\t\t\u003Ctd style=\"border-bottom:1px solid black; border-left:1px solid black; border-right:1px solid black; border-top:1px solid black; vertical-align:top; width:141px\"\u003E\n\t\t\t\u003Cp\u003E&nbsp;\u003C\u002Fp\u003E\n\t\t\t\u003C\u002Ftd\u003E\n\t\t\t\u003Ctd style=\"border-bottom:1px solid black; border-left:none; border-right:1px solid black; border-top:1px solid black; vertical-align:top; width:198px\"\u003E\n\t\t\t\u003Cp\u003E\u003Cspan style=\"font-size:12pt\"\u003E\u003Cstrong\u003E\u003Cspan style=\"color:black\"\u003E富時世界美元計價\u003C\u002Fspan\u003E\u003C\u002Fstrong\u003E\u003Cstrong\u003E\u003Cspan style=\"color:black\"\u003E10\u003C\u002Fspan\u003E\u003C\u002Fstrong\u003E\u003Cstrong\u003E\u003Cspan style=\"color:black\"\u003E年期以上投資級公共事業電能債指數\u003C\u002Fspan\u003E\u003C\u002Fstrong\u003E\u003C\u002Fspan\u003E\u003C\u002Fp\u003E\n\t\t\t\u003C\u002Ftd\u003E\n\t\t\t\u003Ctd style=\"border-bottom:1px solid black; border-left:none; border-right:1px solid black; border-top:1px solid black; vertical-align:top; width:213px\"\u003E\n\t\
